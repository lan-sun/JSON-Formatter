<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON 格式化 / 驗證 / 壓縮工具</title>
<style>
  :root{
    --bg:#f4f5f7;
    --panel:#ffffff;
    --border:#dcdfe4;
    --text:#1f2328;
    --muted:#6b7280;
    --accent:#2563eb;
    --accent-hover:#1d4ed8;
    --danger:#dc2626;
    --danger-bg:#fef2f2;
    --success:#16a34a;
    --success-bg:#f0fdf4;
    --gutter-bg:#fafafa;
    --font-mono: Consolas, Menlo, "Courier New", monospace;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", Arial, sans-serif;
  }
  .app{
    max-width: 1300px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }
  header h1{
    font-size: 20px;
    margin: 0 0 4px;
  }
  header p{
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 13px;
  }
  .panel{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .toolbar{
    display:flex;
    flex-wrap: wrap;
    align-items:center;
    gap:8px;
    padding:10px 12px;
    border-bottom: 1px solid var(--border);
    background: #fbfbfc;
  }
  .toolbar .group{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .toolbar label{
    font-size: 12px;
    color: var(--muted);
  }
  select{
    font-size: 13px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
  }
  button{
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  button:hover{ background:#f2f4f7; }
  button.primary{
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover{ background: var(--accent-hover); }
  button.ghost{
    background: transparent;
  }
  .spacer{ flex: 1 1 auto; }

  .dual-editor{
    display:flex;
    height: 520px;
  }
  .pane{
    flex: 1 1 50%;
    display:flex;
    flex-direction: column;
    min-width: 0;
  }
  .pane + .pane{
    border-left: 1px solid var(--border);
  }
  .pane-head{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    background: #fbfbfc;
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .pane-head .pane-actions{
    display:flex;
    gap: 6px;
  }
  .pane-head button{
    font-size: 11px;
    padding: 3px 8px;
    text-transform: none;
    letter-spacing: 0;
    color: var(--muted);
  }
  .editor-wrap{
    display:flex;
    flex: 1 1 auto;
    min-height: 0;
    border-bottom: 1px solid var(--border);
  }
  .line-numbers{
    flex: 0 0 auto;
    width: 46px;
    padding: 12px 8px 12px 0;
    text-align: right;
    background: var(--gutter-bg);
    color: #9aa1ab;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 21px;
    white-space: pre;
    overflow: hidden;
    border-right: 1px solid var(--border);
    user-select: none;
  }
  .line-numbers .ln-error{
    color: var(--danger);
    font-weight: 700;
  }
  textarea{
    flex: 1 1 auto;
    resize: none;
    border: none;
    outline: none;
    padding: 12px;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 21px;
    white-space: pre;
    overflow: auto;
    tab-size: 2;
    color: var(--text);
    width: 100%;
  }
  textarea#outputArea{
    background: #fafbfc;
    color: #14532d;
  }
  textarea#outputArea.is-error{
    color: var(--danger);
  }
  textarea[readonly]{
    cursor: text;
  }

  .statusbar{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    font-size: 13px;
    background: #fbfbfc;
    min-height: 20px;
  }
  .statusbar .msg{
    display:flex;
    align-items:center;
    gap: 8px;
    flex: 1 1 auto;
  }
  .statusbar .msg.ok{ color: var(--success); }
  .statusbar .msg.err{ color: var(--danger); }
  .statusbar .meta{
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width: 18px; height: 18px;
    border-radius: 50%;
    font-size: 12px;
    font-weight: 700;
    flex: 0 0 auto;
  }
  .msg.ok .badge{ background: var(--success); color:#fff; }
  .msg.err .badge{ background: var(--danger); color:#fff; }

  footer{
    margin-top: 14px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }

  @media (max-width: 820px){
    .dual-editor{ flex-direction: column; height: auto; }
    .pane{ flex: 1 1 auto; }
    .pane + .pane{ border-left: none; border-top: 1px solid var(--border); }
    .editor-wrap{ height: 320px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>JSON 格式化 / 驗證 / 壓縮工具</h1>
    <p>左側貼上 JSON，右側顯示處理結果。純前端運作，不上傳任何資料、不呼叫任何外部 API，全部以原生 JavaScript 實作。</p>
  </header>

  <div class="panel">
    <div class="toolbar">
      <div class="group">
        <label for="indentSelect">縮排：</label>
        <select id="indentSelect">
          <option value="2" selected>2 空格</option>
          <option value="3">3 空格</option>
          <option value="4">4 空格</option>
          <option value="tab">Tab</option>
        </select>
      </div>
      <button id="btnFormat" class="primary">格式化 (Format)</button>
      <button id="btnValidate">驗證 (Validate)</button>
      <button id="btnMinify">壓縮 (Minify)</button>
      <div class="spacer"></div>
      <button id="btnCopyOutput" class="ghost">複製結果</button>
      <button id="btnClear" class="ghost">清空</button>
    </div>

    <div class="dual-editor">
      <div class="pane">
        <div class="pane-head">
          <span>輸入 (Input)</span>
        </div>
        <div class="editor-wrap">
          <div class="line-numbers" id="lineNumbersInput">1</div>
          <textarea id="jsonInput" wrap="off" spellcheck="false" placeholder='在這裡貼上 JSON，例如：{"name":"Luke","tags":["a","b"],"active":true}'></textarea>
        </div>
      </div>
      <div class="pane">
        <div class="pane-head">
          <span>結果 (Output)</span>
        </div>
        <div class="editor-wrap">
          <div class="line-numbers" id="lineNumbersOutput">1</div>
          <textarea id="outputArea" wrap="off" spellcheck="false" readonly placeholder="處理結果會顯示在這裡"></textarea>
        </div>
      </div>
    </div>

    <div class="statusbar">
      <div class="msg" id="statusMsg">
        <span class="badge" id="statusBadge">i</span>
        <span id="statusText">請於左側貼上 JSON，再按「格式化」、「驗證」或「壓縮」。</span>
      </div>
      <div class="meta" id="statusMeta"></div>
    </div>
  </div>

  <footer>格式化 / 驗證 / 壓縮皆由內建的原生 JSON 解析器完成，不依賴瀏覽器內建錯誤訊息，也不使用任何第三方函式庫。</footer>
</div>

<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------------
  // 自製 JSON 解析器（符合 RFC 8259），逐字元掃描並記錄行號 / 欄號，
  // 目的是在語法錯誤時，能像 JSONLint 一樣回報精確位置與說明。
  // ---------------------------------------------------------------------
  function JSONSyntaxError(message, line, col, pos){
    this.name = "JSONSyntaxError";
    this.message = message;
    this.line = line;
    this.col = col;
    this.pos = pos;
  }

  function Parser(text){
    this.text = text;
    this.pos = 0;
    this.line = 1;
    this.col = 1;
  }

  Parser.prototype.peek = function(){
    return this.text[this.pos];
  };

  Parser.prototype.advance = function(){
    var ch = this.text[this.pos];
    if (ch === "\n"){
      this.line++;
      this.col = 1;
    } else {
      this.col++;
    }
    this.pos++;
    return ch;
  };

  Parser.prototype.error = function(msg){
    throw new JSONSyntaxError(msg, this.line, this.col, this.pos);
  };

  Parser.prototype.skipWhitespace = function(){
    while (this.pos < this.text.length){
      var ch = this.peek();
      if (ch === " " || ch === "\t" || ch === "\n" || ch === "\r"){
        this.advance();
      } else {
        break;
      }
    }
  };

  Parser.prototype.parse = function(){
    this.skipWhitespace();
    if (this.pos >= this.text.length){
      this.error("輸入內容是空的，沒有可解析的 JSON");
    }
    var value = this.parseValue();
    this.skipWhitespace();
    if (this.pos < this.text.length){
      this.error('JSON 內容結束後出現多餘的字元 "' + this.peek() + '"');
    }
    return value;
  };

  Parser.prototype.parseValue = function(){
    this.skipWhitespace();
    var ch = this.peek();
    if (ch === undefined){
      this.error("未預期的輸入結尾（Unexpected end of input）");
    }
    if (ch === "{") return this.parseObject();
    if (ch === "[") return this.parseArray();
    if (ch === '"') return this.parseString();
    if (ch === "-" || (ch >= "0" && ch <= "9")) return this.parseNumber();
    if (this.text.substr(this.pos, 4) === "true"){ this.advanceBy(4); return true; }
    if (this.text.substr(this.pos, 5) === "false"){ this.advanceBy(5); return false; }
    if (this.text.substr(this.pos, 4) === "null"){ this.advanceBy(4); return null; }
    this.error('未預期的字元 "' + ch + '"');
  };

  Parser.prototype.advanceBy = function(n){
    for (var i = 0; i < n; i++) this.advance();
  };

  Parser.prototype.parseObject = function(){
    this.advance(); // consume {
    var obj = {};
    this.skipWhitespace();
    if (this.peek() === "}"){ this.advance(); return obj; }

    while (true){
      this.skipWhitespace();
      if (this.peek() !== '"'){
        this.error('物件的鍵（key）必須是雙引號字串，但找到 "' + (this.peek() === undefined ? "EOF" : this.peek()) + '"');
      }
      var key = this.parseString();
      this.skipWhitespace();
      if (this.peek() !== ":"){
        this.error('缺少冒號 ":"，但找到 "' + (this.peek() === undefined ? "EOF" : this.peek()) + '"');
      }
      this.advance(); // :
      var value = this.parseValue();
      obj[key] = value;
      this.skipWhitespace();

      var ch = this.peek();
      if (ch === ","){
        this.advance();
        this.skipWhitespace();
        if (this.peek() === "}"){
          this.error("物件中有多餘的逗號（trailing comma）");
        }
        continue;
      } else if (ch === "}"){
        this.advance();
        break;
      } else {
        this.error('物件格式錯誤，預期是 "," 或 "}"，但找到 "' + (ch === undefined ? "EOF" : ch) + '"');
      }
    }
    return obj;
  };

  Parser.prototype.parseArray = function(){
    this.advance(); // consume [
    var arr = [];
    this.skipWhitespace();
    if (this.peek() === "]"){ this.advance(); return arr; }

    while (true){
      var value = this.parseValue();
      arr.push(value);
      this.skipWhitespace();

      var ch = this.peek();
      if (ch === ","){
        this.advance();
        this.skipWhitespace();
        if (this.peek() === "]"){
          this.error("陣列中有多餘的逗號（trailing comma）");
        }
        continue;
      } else if (ch === "]"){
        this.advance();
        break;
      } else {
        this.error('陣列格式錯誤，預期是 "," 或 "]"，但找到 "' + (ch === undefined ? "EOF" : ch) + '"');
      }
    }
    return arr;
  };

  Parser.prototype.parseString = function(){
    this.advance(); // consume opening quote
    var result = "";
    while (true){
      var ch = this.peek();
      if (ch === undefined){
        this.error("字串未正確結束（缺少結尾的雙引號）");
      }
      if (ch === '"'){
        this.advance();
        break;
      }
      if (ch === "\n"){
        this.error("字串中包含未轉義的換行字元");
      }
      if (ch === "\\"){
        this.advance();
        var esc = this.peek();
        switch (esc){
          case '"': result += '"'; this.advance(); break;
          case "\\": result += "\\"; this.advance(); break;
          case "/": result += "/"; this.advance(); break;
          case "b": result += "\b"; this.advance(); break;
          case "f": result += "\f"; this.advance(); break;
          case "n": result += "\n"; this.advance(); break;
          case "r": result += "\r"; this.advance(); break;
          case "t": result += "\t"; this.advance(); break;
          case "u": {
            this.advance();
            var hex = "";
            for (var i = 0; i < 4; i++){
              var h = this.peek();
              if (h === undefined || !/[0-9a-fA-F]/.test(h)){
                this.error("無效的 \\u 跳脫序列");
              }
              hex += h;
              this.advance();
            }
            result += String.fromCharCode(parseInt(hex, 16));
            break;
          }
          default:
            this.error('無效的跳脫字元 "\\' + esc + '"');
        }
      } else {
        result += ch;
        this.advance();
      }
    }
    return result;
  };

  Parser.prototype.parseNumber = function(){
    var numStr = "";
    if (this.peek() === "-"){ numStr += this.advance(); }

    if (this.peek() === "0"){
      numStr += this.advance();
    } else if (this.peek() >= "1" && this.peek() <= "9"){
      while (this.peek() >= "0" && this.peek() <= "9"){ numStr += this.advance(); }
    } else {
      this.error("無效的數字格式");
    }

    if (this.peek() === "."){
      numStr += this.advance();
      if (!(this.peek() >= "0" && this.peek() <= "9")){
        this.error("小數點後必須至少有一個數字");
      }
      while (this.peek() >= "0" && this.peek() <= "9"){ numStr += this.advance(); }
    }

    if (this.peek() === "e" || this.peek() === "E"){
      numStr += this.advance();
      if (this.peek() === "+" || this.peek() === "-"){ numStr += this.advance(); }
      if (!(this.peek() >= "0" && this.peek() <= "9")){
        this.error("指數（e/E）後面的格式錯誤");
      }
      while (this.peek() >= "0" && this.peek() <= "9"){ numStr += this.advance(); }
    }

    return Number(numStr);
  };

  function parseJSONStrict(text){
    var parser = new Parser(text);
    return parser.parse();
  }

  // ---------------------------------------------------------------------
  // UI 邏輯
  // ---------------------------------------------------------------------
  var inputArea = document.getElementById("jsonInput");
  var outputArea = document.getElementById("outputArea");
  var lineNumbersInput = document.getElementById("lineNumbersInput");
  var lineNumbersOutput = document.getElementById("lineNumbersOutput");
  var indentSelect = document.getElementById("indentSelect");
  var statusMsg = document.getElementById("statusMsg");
  var statusBadge = document.getElementById("statusBadge");
  var statusText = document.getElementById("statusText");
  var statusMeta = document.getElementById("statusMeta");

  var LINE_HEIGHT = 21; // px，需與 CSS 中 line-height 一致

  function renderLineNumbers(target, textValue, errorLine){
    var lineCount = textValue.split("\n").length;
    var parts = [];
    for (var i = 1; i <= lineCount; i++){
      if (i === errorLine){
        parts.push('<span class="ln-error">' + i + "</span>");
      } else {
        parts.push(String(i));
      }
    }
    target.innerHTML = parts.join("\n");
  }

  function updateInputLineNumbers(errorLine){
    renderLineNumbers(lineNumbersInput, inputArea.value, errorLine);
  }

  function updateOutputLineNumbers(){
    renderLineNumbers(lineNumbersOutput, outputArea.value);
  }

  function setStatus(type, text, meta){
    statusMsg.className = "msg " + type;
    statusBadge.textContent = type === "ok" ? "✓" : (type === "err" ? "!" : "i");
    statusText.textContent = text;
    statusMeta.textContent = meta || "";
  }

  function setOutput(text, isError){
    outputArea.value = text;
    outputArea.classList.toggle("is-error", !!isError);
    updateOutputLineNumbers();
  }

  function highlightInputLine(lineNumber){
    var lines = inputArea.value.split("\n");
    var start = 0;
    for (var i = 0; i < lineNumber - 1; i++){
      start += lines[i].length + 1; // +1 for the \n
    }
    var end = start + (lines[lineNumber - 1] ? lines[lineNumber - 1].length : 0);

    inputArea.focus();
    inputArea.setSelectionRange(start, end);

    var targetScrollTop = Math.max(0, (lineNumber - 1) * LINE_HEIGHT - inputArea.clientHeight / 2);
    inputArea.scrollTop = targetScrollTop;
    lineNumbersInput.scrollTop = inputArea.scrollTop;
  }

  function buildCaretLine(lineText, col){
    var caret = "";
    for (var i = 0; i < col - 1; i++){
      caret += (lineText[i] === "\t") ? "\t" : " ";
    }
    caret += "^";
    return caret;
  }

  function describeValue(v){
    if (Array.isArray(v)) return "Array（" + v.length + " 個元素）";
    if (v === null) return "null";
    var t = typeof v;
    if (t === "object") return "Object（" + Object.keys(v).length + " 個鍵）";
    if (t === "string") return "String";
    return t;
  }

  function getIndentValue(){
    var v = indentSelect.value;
    if (v === "tab") return "\t";
    return parseInt(v, 10);
  }

  function charAndLineMeta(text){
    var lines = text.split("\n").length;
    return text.length + " 個字元 / " + lines + " 行";
  }

  function handleFormat(){
    var raw = inputArea.value;
    try {
      var value = parseJSONStrict(raw);
      updateInputLineNumbers();
      var indent = getIndentValue();
      var formatted = JSON.stringify(value, null, indent);
      setOutput(formatted, false);
      setStatus("ok", "格式化完成", charAndLineMeta(formatted));
    } catch (e){
      reportError(e);
    }
  }

  function handleMinify(){
    var raw = inputArea.value;
    try {
      var value = parseJSONStrict(raw);
      updateInputLineNumbers();
      var minified = JSON.stringify(value);
      setOutput(minified, false);
      setStatus("ok", "壓縮完成", charAndLineMeta(minified));
    } catch (e){
      reportError(e);
    }
  }

  function handleValidate(){
    var raw = inputArea.value;
    try {
      var value = parseJSONStrict(raw);
      updateInputLineNumbers();
      var report = "✔ JSON 格式正確（Valid JSON）\n\n" +
        "根節點型別：" + describeValue(value) + "\n" +
        "字元數：" + raw.length + "\n" +
        "行數：" + raw.split("\n").length;
      setOutput(report, false);
      setStatus("ok", "JSON 格式正確（Valid JSON）", charAndLineMeta(raw));
    } catch (e){
      reportError(e, true);
    }
  }

  function reportError(e, isValidateAction){
    if (e instanceof JSONSyntaxError){
      updateInputLineNumbers(e.line);
      setStatus("err", "JSON 格式錯誤：第 " + e.line + " 行，第 " + e.col + " 欄", charAndLineMeta(inputArea.value));
      highlightInputLine(e.line);

      var lines = inputArea.value.split("\n");
      var lineText = lines[e.line - 1] || "";
      var caretLine = buildCaretLine(lineText, e.col);
      var report = "✘ JSON 格式錯誤（Invalid JSON）\n\n" +
        "位置：第 " + e.line + " 行，第 " + e.col + " 欄\n" +
        "說明：" + e.message + "\n\n" +
        "--- 第 " + e.line + " 行內容 ---\n" +
        lineText + "\n" +
        caretLine;
      setOutput(report, true);
    } else {
      updateInputLineNumbers();
      setStatus("err", "發生未預期的錯誤", "");
      setOutput("發生未預期的錯誤：" + String(e && e.message ? e.message : e), true);
    }
  }

  function handleClear(){
    inputArea.value = "";
    setOutput("", false);
    updateInputLineNumbers();
    setStatus("i", "已清空。請於左側貼上 JSON，再按「格式化」、「驗證」或「壓縮」。", "");
    inputArea.focus();
  }

  function handleCopyOutput(){
    var text = outputArea.value;
    if (!text){
      setStatus("i", "右側目前沒有內容可以複製。", "");
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        setStatus("ok", "已複製結果到剪貼簿", "");
      }, function(){
        fallbackCopy();
      });
    } else {
      fallbackCopy();
    }
  }

  function fallbackCopy(){
    outputArea.focus();
    outputArea.select();
    try {
      document.execCommand("copy");
      setStatus("ok", "已複製結果到剪貼簿", "");
    } catch (e){
      setStatus("err", "複製失敗，請手動選取並複製。", "");
    }
  }

  document.getElementById("btnFormat").addEventListener("click", handleFormat);
  document.getElementById("btnValidate").addEventListener("click", handleValidate);
  document.getElementById("btnMinify").addEventListener("click", handleMinify);
  document.getElementById("btnClear").addEventListener("click", handleClear);
  document.getElementById("btnCopyOutput").addEventListener("click", handleCopyOutput);

  inputArea.addEventListener("input", function(){
    updateInputLineNumbers();
  });
  inputArea.addEventListener("scroll", function(){
    lineNumbersInput.scrollTop = inputArea.scrollTop;
  });
  outputArea.addEventListener("scroll", function(){
    lineNumbersOutput.scrollTop = outputArea.scrollTop;
  });

  // 初始化
  updateInputLineNumbers();
  updateOutputLineNumbers();
})();
</script>
